# Checks the live Hold'em Trainer site after each deploy and once a day. GitHub emails you if a run fails,
# and every run's results are on this repository's Actions tab.
name: Check the live site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # A deploy takes about a minute to go live, so wait before checking it.
      - if: github.event_name == 'push'
        run: sleep 90
      - run: npx playwright test
